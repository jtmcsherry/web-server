{% extends "base.html" %}
{% block title %}{{ bookmark.title }}{% endblock %}
{% block content %}
  <h1>{{ bookmark.title }}</h1>
  <dl>
    <dt>ID</dt>    <dd>{{ bookmark.id }}</dd>
    <dt>URL</dt>   <dd><a href="{{ bookmark.url }}">{{ bookmark.url }}</a></dd>
    <dt>Tags</dt>  <dd>{{ bookmark.tags | join(", ") if bookmark.tags else "-" }}</dd>
  </dl>
  {% if is_owner %}
  <hr>
  <p><a href="/bookmarks/{{ bookmark.id }}/edit">Edit</a> |
     <form method="post" action="/bookmarks/{{ bookmark.id }}/delete" style="display:inline">
       <button type="submit">Delete</button>
     </form>
  </p>
  {% endif %}
{% endblock %}
