{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
  <h1>Login</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><label>Username<br><input type="text" name="username" required size="60"></label></p>
    <p><label>Password<br><input type="password" name="password" required size="60"></label></p>
    <p><button type="submit">Login</button></p>
  </form>
  <p>Don't have an account? <a href="/register">Register</a></p>
{% endblock %}
