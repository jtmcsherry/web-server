{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Register</h1>
  {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <p><label>Username<br><input type="text" name="username" required size="60"></label></p>
    <p><label>Password<br><input type="password" name="password" required size="60"></label></p>
    <p><label>Confirm Password<br><input type="password" name="confirm_password" required size="60"></label></p>
    <p><button type="submit">Register</button></p>
  </form>
  <p>Already have an account? <a href="/login">Login</a></p>
{% endblock %}
